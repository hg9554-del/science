<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5분 과학 안전교육 - 꼬마 과학자의 실험실</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f8fb;--card:#ffffff;--ink:#16323f;--sub:#52707e;--line:#b9cdd8;
  --acc:#0f7c8a;--acc2:#e3f4f5;--ok:#1b8a5a;--okbg:#e3f7ee;
  --warn:#9a5b00;--warnbg:#fff3d4;--bad:#d94136;--badbg:#fdeceb;
  --hl:#ffe36e;box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1c23;--card:#162832;--ink:#e6f1f5;--sub:#9db8c4;--line:#37535f;
    --acc:#4cc3d1;--acc2:#12363d;--ok:#4ad195;--okbg:#113627;
    --warn:#ffcf7a;--warnbg:#3a2f12;--bad:#ff8078;--badbg:#3d1917;
    color-scheme:dark;
  }
}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:18px 16px 64px}
h1,h2,h3{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;margin:0}
h1{font-size:28px}
h2{font-size:24px;margin-bottom:4px}
.sub{color:var(--sub);margin:0 0 16px;font-size:15px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.timer-box{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--acc);border-radius:999px;padding:5px 14px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.timer-box.low{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.timer-box button{background:none;border:none;color:inherit;cursor:pointer;font-size:14px;padding:0 2px;font-weight:700}
nav{display:flex;gap:6px;margin:10px 0 18px}
nav button{flex:1;padding:10px 4px;border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;font:inherit;font-size:13px;cursor:pointer;line-height:1.25}
nav button.on{border-color:var(--acc);background:var(--acc);color:#fff;font-weight:700}
nav button.done{color:var(--acc);border-color:var(--acc);background:var(--acc2)}
nav button:disabled{opacity:.45;cursor:default}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:22px 18px}
.btn{font:inherit;border:2px solid var(--acc);background:var(--acc2);color:var(--acc);border-radius:10px;padding:8px 15px;cursor:pointer;font-weight:700;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--acc);color:#fff;padding:11px 22px;font-size:17px}
.btn.main:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--line);background:var(--bg);color:var(--sub)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;cursor:pointer;font-family:Jua,sans-serif;font-size:19px}
.seg button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.unit-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:inherit;cursor:pointer}
.unit:hover{border-color:var(--acc);background:var(--acc2)}
.unit b{font-size:17px;display:block}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.tag.hot{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.banner{background:var(--acc2);border:2px solid var(--acc);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.banner b{display:block;font-size:16px;color:var(--acc)}

/* 1단계 복장 점검 */
.gear-wrap{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center}
@media(max-width:640px){.gear-wrap{grid-template-columns:1fr}}
.char-box{text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px}
.char-box svg{width:100%;max-width:210px;height:auto;display:block;margin:0 auto}
.chk-card{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.chk-card.checked{border-color:var(--ok);background:var(--okbg)}
.chk-card input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.chk-card b{display:block;font-size:16px}
.chk-card small{display:block;color:var(--sub);font-size:13.5px}
.badge-req{display:inline-block;font-size:11px;font-weight:700;background:var(--warnbg);color:var(--warn);padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:middle}

/* 2단계 퀴즈 */
.q-prog{font-size:14px;font-weight:700;color:var(--acc);margin-bottom:8px}
.q-card{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:18px 16px}
.q-title{font-size:19px;font-weight:700;margin:6px 0 14px;line-height:1.45}
.ox-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-btn{width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.opt-btn:hover{border-color:var(--acc);background:var(--acc2)}
.opt-btn.ox{text-align:center;font-family:Jua,sans-serif;font-size:34px;padding:18px 10px;margin:0}
.opt-btn.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt-btn.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad)}

/* 3단계 위급 상황 대처 (빈칸 채우기 미션) */
.em-card{border:2px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:14px;background:var(--bg)}
.em-card.done{border-color:var(--ok);background:var(--okbg)}
.em-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.em-head b{font-size:17px}
.em-status{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.em-card.done .em-status{background:var(--ok);border-color:var(--ok);color:#fff}
.em-sent{font-size:16px;line-height:1.7;margin:6px 0 12px;background:var(--card);padding:12px 14px;border-radius:10px;border:1.5px solid var(--line)}
.blank{display:inline-block;padding:0 10px;margin:0 3px;border-radius:8px;border:2px dashed var(--acc);background:var(--acc2);color:var(--acc);font-weight:800;min-width:72px;text-align:center}
.blank.filled{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.em-choices{display:flex;gap:8px;flex-wrap:wrap}
.em-choices button{flex:1;min-width:140px;padding:10px 12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.em-choices button:hover{border-color:var(--acc);background:var(--acc2)}
.em-sub{margin:8px 0 0;font-size:14px;color:var(--sub)}

/* 4단계 서약 & 통과증 */
.pledge-box{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
input[type=text],input[type=url],select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.sig-wrap{margin-top:10px}
canvas.sig{width:100%;height:120px;background:#ffffff;border:2px dashed var(--acc);border-radius:10px;touch-action:none;display:block;cursor:crosshair}
.pass-card{border:4px solid var(--acc);border-radius:20px;padding:24px 20px;background:linear-gradient(180deg,var(--acc2) 0%,var(--card) 34%);text-align:center;position:relative;overflow:hidden}
.pass-stamp{display:inline-block;border:3px solid var(--ok);color:var(--ok);font-family:Jua,sans-serif;font-size:22px;padding:4px 16px;border-radius:10px;transform:rotate(-5deg);margin:8px 0 12px;background:var(--okbg)}
.pass-name{font-family:Jua,sans-serif;font-size:32px;margin:4px 0}
.pass-meta{color:var(--sub);font-size:15px;margin:4px 0}
.pass-sig{max-width:220px;height:66px;object-fit:contain;margin:8px auto 0;display:block;background:#ffffff;border-radius:8px;padding:4px;border:1.5px solid var(--line)}
.sync-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700}
.sync-pill.ok{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok)}
.sync-pill.wait{background:var(--warnbg);color:var(--warn);border:1.5px solid var(--warn)}
.sync-pill.err{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad)}

/* 교사용 설정 & QR & 현황판 */
.t-box{margin-top:18px;padding:16px;border:2px dashed var(--acc);border-radius:14px;background:var(--bg)}
.t-sec{margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line)}
.t-label{display:block;font-weight:700;font-size:14.5px;margin-bottom:5px}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;margin:8px 0}
.t-chip{display:flex;align-items:center;gap:6px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:14px;font-weight:700}
.t-chip.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.url-out{font-size:12.5px;word-break:break-all;background:var(--card);border:1.5px solid var(--line);padding:8px 10px;border-radius:8px;margin:8px 0;color:var(--sub)}
.qr-box{margin-top:12px;padding:16px;background:var(--card);border:2px solid var(--acc);border-radius:14px;text-align:center}
.qr-box img{width:230px;height:230px;max-width:100%;display:block;margin:8px auto;background:#fff;padding:10px;border-radius:10px;border:1.5px solid var(--line)}
.board-box{margin-top:12px;padding:14px;background:var(--card);border:2px solid var(--line);border-radius:12px}
.board-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stu-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--okbg);border:1.5px solid var(--ok);color:var(--ok);font-weight:700;font-size:14px}
.stu-chip small{font-weight:500;opacity:.85;font-size:12px}
details.script-help{margin-top:10px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}
details.script-help summary{cursor:pointer;font-weight:700;color:var(--acc)}
details.script-help pre{margin:8px 0;padding:10px;background:var(--bg);border-radius:8px;overflow-x:auto;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-all}
.hint{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>🧪 5분 과학 안전교육</h1>
    <div class="timer-box" id="timerBox" hidden>
      <span>⏱ <span id="tVal">05:00</span></span>
      <button id="tToggle" title="일시정지/계속">⏸</button>
      <button id="tReset" title="5분 다시 시작">↻</button>
    </div>
  </div>
  <nav id="nav" hidden></nav>
  <div class="panel" id="view"></div>
  <p style="text-align:right;margin-top:12px">
    <button class="btn ghost" id="homeBtn" style="font-size:13px;padding:6px 12px" hidden>처음(단원 선택)으로</button>
  </p>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const APPS_SCRIPT_CODE = `function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['날짜', '완료시각', '수업/단원명', '학생이름', '위험요소', '소요시간']);
  }
  var data = JSON.parse(e.postData.contents);
  sheet.appendRow([
    data.date || '',
    data.time || '',
    data.unit || '',
    data.name || '',
    data.tags || '',
    data.elapsed || ''
  ]);
  return ContentService.createTextOutput(JSON.stringify({ok: true}))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var rows = sheet.getDataRange().getValues();
  var tz = Session.getScriptTimeZone();
  var targetDate = (e && e.parameter && e.parameter.date) ? e.parameter.date : '';
  var targetUnit = (e && e.parameter && e.parameter.unit) ? e.parameter.unit : '';
  var list = [];
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i];
    var dStr = (r[0] instanceof Date) ? Utilities.formatDate(r[0], tz, 'yyyy-MM-dd') : String(r[0]).trim();
    var tStr = (r[1] instanceof Date) ? Utilities.formatDate(r[1], tz, 'HH:mm') : String(r[1]).trim();
    var uStr = String(r[2]).trim();
    var nStr = String(r[3]).trim();
    if (targetDate && dStr !== targetDate) continue;
    if (targetUnit && uStr !== targetUnit) continue;
    list.push({date: dStr, time: tStr, unit: uStr, name: nStr});
  }
  var sheetUrl = SpreadsheetApp.getActiveSpreadsheet().getUrl();
  return ContentService.createTextOutput(JSON.stringify({ok: true, sheetUrl: sheetUrl, list: list}))
    .setMimeType(ContentService.MimeType.JSON);
}`;

const TAGS={
  heat:{n:'불·뜨거운 물',ic:'🔥'},
  glass:{n:'유리 기구',ic:'🧪'},
  chem:{n:'약품·용액',ic:'🧴'},
  elec:{n:'전기·전지',ic:'⚡'},
  sharp:{n:'날카로운 도구',ic:'✂️'},
  bio:{n:'생물·야외 관찰',ic:'🌿'}
};

const UNITS={
  '3-1':[
    {n:'힘과 우리 생활',t:['sharp']},
    {n:'동물의 생활',t:['bio']},
    {n:'식물의 생활',t:['bio']},
    {n:'생물의 한살이',t:['bio']}
  ],
  '3-2':[
    {n:'물체와 물질',t:['sharp','glass']},
    {n:'지구와 바다',t:['glass','chem']},

    {n:'감염병과 건강한 생활',t:['chem']}
  ],
  '4-1':[
    {n:'자석의 이용',t:['sharp']},
    {n:'물의 상태 변화',t:['heat','glass']},
    {n:'땅의 변화',t:['glass','bio']},
    {n:'다양한 생물과 우리 생활',t:['bio']}
  ],
  '4-2':[
    {n:'밤하늘 관찰',t:['elec']},
    {n:'여러 가지 기체',t:['heat','glass']},
    {n:'생물과 환경',t:['bio']},

  ],
  '5-1':[

    {n:'빛의 성질',t:['elec','glass']},

  ],

    {n:'혼합물의 분리',t:['glass','sharp']},
    {n:'날씨와 우리 생활',t:['elec','heat']},
    {n:'열과 우리 생활',t:['heat','glass']},
    {n:'자원과 에너지',t:['heat','glass']}
  ],
  '6-1':[
    {n:'산과 염기',t:['chem','glass']},
    {n:'물체의 운동',t:['sharp']},
    {n:'식물의 구조와 기능',t:['sharp','bio']},
    {n:'지구의 운동',t:['bio']}
  ],
  '6-2':[
    {n:'계절의 변화',t:['heat','elec']},
    {n:'물질의 연소',t:['heat','glass']},
    {n:'전기의 이용',t:['elec']}
  ]
};

const QUIZZES={
  base:[
    {type:'ox',q:'실험실에서는 목이 마를 때 몰래 음료수나 간식을 먹어도 된다.',ans:1,exp:'실험실에서는 눈에 보이지 않는 약품이나 먼지가 묻을 수 있어 절대 음식이나 음료를 먹지 않아요.'},
    {type:'ox',q:'실험을 마친 뒤에는 사용한 도구를 정리하고 반드시 손을 깨끗이 씻는다.',ans:0,exp:'실험 후에는 제자리에 정리하고 비누로 손을 깨끗이 씻어야 안전해요.'}
  ],
  heat:[
    {type:'ox',q:'뜨거운 물이나 가열한 비커는 잠깐만 잡으면 괜찮으니 맨손으로 옮겨도 된다.',ans:1,exp:'뜨거운 기구는 순식간에 화상을 입을 수 있어요. 반드시 면장갑(열 차단 장갑)이나 집게를 써요.'},
    {type:'mc',q:'알코올램프나 촛불, 전등을 사용할 때 가장 올바른 행동은?',opts:['얼굴을 가까이 대고 불꽃을 관찰한다.','긴 머리를 묶고 주변에 타기 쉬운 종이를 치운다.','장난으로 친구 쪽으로 불을 가까이 댄다.'],ans:1,exp:'머리카락이나 종이에 불이 옮겨붙지 않도록 머리를 묶고 주변을 깨끗이 정리해야 해요.'}
  ],
  glass:[
    {type:'ox',q:'비커나 시험관이 깨졌을 때는 얼른 맨손으로 조각을 주워 쓰레기통에 버린다.',ans:1,exp:'깨진 유리 조각에 손을 깊게 벨 수 있어요! 절대 만지지 말고 바로 선생님께 알려야 해요.'},
    {type:'mc',q:'유리 기구를 사용할 때 바른 자세는 무엇일까요?',opts:['책상 끝부분에 아슬아슬하게 놓는다.','두 손으로 조심스럽게 옮기고 책상 안쪽에 둔다.','유리 막대로 비커 벽을 세게 두드린다.'],ans:1,exp:'유리 기구는 떨어뜨리지 않게 두 손으로 옮기고, 책상 안쪽에 안전하게 두어야 해요.'}

function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 타이머 (5분 = 300초)
let tSec=300, tInt=null, tRun=false;
function fmtTime(s){const m=String(Math.floor(s/60)).padStart(2,'0'),r=String(s%60).padStart(2,'0');return `${m}:${r}`}
function updateTimerUI(){
  $('#tVal').textContent=fmtTime(tSec);
  $('#timerBox').classList.toggle('low',tSec<=60);
  $('#tToggle').textContent=tRun?'⏸':'▶';
}
function startTimer(){
  $('#timerBox').hidden=false;
  if(tRun)return;
  tRun=true;updateTimerUI();
  tInt=setInterval(()=>{
    if(tSec>0){tSec--;updateTimerUI();}
    else{clearInterval(tInt);tRun=false;updateTimerUI();}
  },1000);
}
function stopTimer(){clearInterval(tInt);tRun=false;updateTimerUI();}
$('#tToggle').onclick=()=>{if(tRun)stopTimer();else startTimer()};
$('#tReset').onclick=()=>{stopTimer();tSec=300;startTimer()};
$('#homeBtn').onclick=()=>{
  if(confirm('단원 선택 화면으로 돌아갈까요?')){
    stopTimer();tSec=300;$('#timerBox').hidden=true;
    S.step=0;S.passIssued=false;S.lockedSession=false;render(true);
  }
};

function buildQuiz(tags){
  let pool=[];
  tags.forEach(t=>{if(QUIZZES[t])pool=pool.concat(QUIZZES[t].map(q=>Object.assign({tag:t},q)))});
  pool=pool.concat(QUIZZES.base.map(q=>Object.assign({tag:'base'},q)));
  const picked=[], used=new Set();
  tags.forEach(t=>{
    const item=pool.find(q=>q.tag===t && !used.has(q.q));
    if(item && picked.length<4){picked.push(item);used.add(item.q);}
  });
  for(const q of pool){
    if(picked.length>=4)break;
    if(!used.has(q.q)){picked.push(q);used.add(q.q);}
  }
  return picked;
}

function startSession(unitName, tags, grade=0, sem=0, locked=false){
  S.unitName=unitName;
  S.tags=tags.length?tags:['heat','glass'];
  S.grade=grade; S.sem=sem; S.lockedSession=locked;
  S.gears=[]; S.emDone=[]; S.emWrong={}; S.qList=buildQuiz(S.tags);
  S.qIdx=0; S.qSolved=false; S.qWrong=false;
  S.pledged=false; S.passIssued=false; S.syncState='';
  S.step=1;
  tSec=300; startTimer();
  render(true);
}

function renderNav(){
  const show=S.step>0;
  $('#nav').hidden=!show;
  $('#homeBtn').hidden=!show || S.lockedSession;
  if(!show)return;
  const labels=['1. 복장 점검','2. 안전 퀴즈','3. 위급 대처','4. 안전 통과증'];
  $('#nav').innerHTML=labels.map((lb,i)=>{
    const idx=i+1;
    const cls=S.step===idx?'on':S.step>idx?'done':'';
    const dis=idx>S.step && !S.passIssued ? 'disabled' : '';
    return `<button class="${cls}" ${dis} data-go="${idx}">${lb}</button>`;
  }).join('');
  $('#nav').querySelectorAll('button:not(:disabled)').forEach(b=>{
    b.onclick=()=>{S.step=+b.dataset.go;render(true)};
  });
}

function tagBadges(tags){
  return tags.map(t=>`<span class="tag hot">${TAGS[t].ic} ${TAGS[t].n}</span>`).join('');
}

async function copyStr(text){
  try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;
  }catch(e){return false;}
}

/* 구글 시트로 완료 기록 전송 */
async function sendToSheet(){
  if(!S.sheetUrl || !S.sheetUrl.startsWith('http')) return;
  S.syncState='wait';
  render();
  const payload={
    date: S.passDate,
    time: S.passTime,
    unit: S.unitName,
    name: S.studentName.trim(),
    tags: S.tags.map(t=>TAGS[t].n).join(', '),
    elapsed: fmtTime(Math.max(0, 300-tSec))
  };
  try{
    await fetch(S.sheetUrl, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    S.syncState='ok';
  }catch(e){
    S.syncState='err';
  }
  render();
}

/* 구글 시트 연결 테스트 */
async function testSheetConnection(){
  const urlStr=(S.sheetUrl||'').trim();
  if(!urlStr || !urlStr.startsWith('https://script.google.com/')){
    S.connState='err';
    S.connMsg='올바른 Apps Script 웹 앱 주소(https://script.google.com/.../exec)를 입력해 주세요.';
    render();return;
  }
  S.connState='wait';
  S.connMsg='구글 시트와 연결을 확인하는 중...';
  render();
  try{
    const sep=urlStr.includes('?')?'&':'?';
    const res=await fetch(urlStr+sep+'date='+encodeURIComponent(todayISO()), {method:'GET', redirect:'follow'});
    const text=await res.text();
    let data=null;
    try{data=JSON.parse(text)}catch(e){}
    if(data && data.ok){
      S.connState='ok';
      if(data.sheetUrl) S.spreadsheetUrl=data.sheetUrl;
      S.connMsg='연결 성공! 구글 시트와 정상적으로 통신하고 있어요.';
    }else{
      S.connState='err';
      S.connMsg='주소는 열렸지만 올바른 응답이 아니에요. Apps Script 코드가 정확히 저장·배포되었는지 확인해 주세요.';
    }
  }catch(e){
    S.connState='err';
    S.connMsg='연결 실패: 배포 시 [액세스 권한: 모든 사용자]로 설정했는지 확인해 주세요. (학교/교육청 계정은 외부 공개가 막혀 있을 수 있어 개인 Gmail 계정을 권장합니다.)';
  }
  render();
}

      S.sheetUrl=''; S.spreadsheetUrl=''; S.connState=''; S.connMsg='';

      render();
    };
    $('#toggleScriptBtn').onclick=()=>{S.showScript=!S.showScript;render()};
    $('#closeScriptBtn').onclick=()=>{S.showScript=false;render()};

      const ok=await copyStr(APPS_SCRIPT_CODE);

      m.textContent=ok?'Apps Script 코드를 복사했어요! 구글 시트 [확장 프로그램 → Apps Script]에 붙여 넣어 주세요.':'자동 복사에 실패했어요. 위 상자의 코드를 직접 선택해 복사해 주세요.';
    };
    $('#copyLink').onclick=async()=>{
      const u=makeUrl();

      m.textContent=ok?'학생용 링크를 복사했어요! 학급 게시판이나 메신저로 공유해 주세요.':'자동 복사가 안 돼요. 위 상자의 주소를 직접 복사해 주세요.';
    };
    $('#makeQR').onclick=()=>{
      S.showQR=!S.showQR;

    $('#previewCustom').onclick=()=>{

      startSession($('#cTitle').value.trim()||'선생님 지정 실험', ts, 0, 0, false);
    };
  }
}

function viewStep2(){

  const tagLabel=q.tag==='base'?'🛡️ 기본 안전 수칙':`${TAGS[q.tag].ic} ${TAGS[q.tag].n}`;

      <button class="opt-btn ox ${S.qSolved&&q.ans===0?'ok':''}" data-a="0">⭕ O</button>
      <button class="opt-btn ox ${S.qSolved&&q.ans===1?'ok':''}" data-a="1">❌ X</button>

  }else{
    optHtml=q.opts.map((op,i)=>`<button class="opt-btn ${S.qSolved&&q.ans===i?'ok':''}" data-a="${i}">${i+1}. ${esc(op)}</button>`).join('');
  }
  const fbHtml=S.qSolved
    ?`<div class="fb ok"><b>✔ 정답이에요!</b> ${esc(q.exp)}</div>`
    :S.qWrong

      ${optHtml}
      ${fbHtml}

    <div class="bar">

      <button class="btn main" id="qNext" ${S.qSolved?'':'disabled'}>${S.qIdx+1<S.qList.length?'다음 문제 ▶':'다음: 위급 상황 대처 ▶'}</button>

  };
}

/* 3단계: 위급 상황 대처법 (빈칸 채우기 미션) */
function viewStep3(){

    ${keys.map(k=>{
      const em=EMERGENCIES[k], ok=S.emDone.includes(k), wrong=!!S.emWrong[k];

      return `<div class="em-card ${ok?'done':''}">
        <div class="em-head">

        <div class="em-sent">

        ${ok
          ?`<p class="em-sub" style="color:var(--ok);font-weight:700">💡 ${esc(em.tip)}</p>`
          :`<div class="em-choices">${order.map(ci=>`<button data-emk="${k}" data-ci="${ci}">${esc(em.choices[ci])}</button>`).join('')}</div>
            ${wrong?`<div class="fb no" style="margin-top:8px;padding:8px 12px"><b>✖ 다시 골라 볼까요?</b> ${esc(em.tip)}</div>`:''}`
        }
      </div>`;
    }).join('')}
    <div class="bar">
      <button class="btn ghost" id="b2">◀ 이전</button>
      <button class="btn main" id="to4" ${allDone?'':'disabled'}>다음: 안전 서약 및 통과증 ▶</button>
    </div>
  `;
  document.querySelectorAll('[data-emk]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.emk, ci=+b.dataset.ci;
    if(ci===EMERGENCIES[k].ans){
      if(!S.emDone.includes(k))S.emDone.push(k);
      delete S.emWrong[k];

      S.emWrong[k]=true;
    }
    render();
  });
  $('#b2').onclick=()=>{S.step=2;render(true)};
  $('#to4').onclick=()=>{S.step=4;render(true)};
}

/* 통과증을 PNG 이미지로 생성하여 다운로드 */
function downloadPassPNG(){
  const W=840, H=560;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');

  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,175);
  grad.addColorStop(0,'#e3f4f5');
  grad.addColorStop(1,'#ffffff');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,175);

  ctx.strokeStyle='#0f7c8a';
  ctx.lineWidth=12;
  ctx.strokeRect(14,14,W-28,H-28);

  ctx.textAlign='center';
  ctx.fillStyle='#0f7c8a';
  ctx.font='700 20px "Noto Sans KR", sans-serif';
  ctx.fillText('꼬마 과학자의 실험실 · 5분 안전교육 완료', W/2, 68);

  ctx.save();
  ctx.translate(W/2, 122);
  ctx.rotate(-0.06);
  ctx.fillStyle='#e3f7ee';
  ctx.strokeStyle='#1b8a5a';
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.roundRect(-145, -26, 290, 52, 12);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1b8a5a';
  ctx.font='700 28px "Jua", "Noto Sans KR", sans-serif';
  ctx.fillText('✔ 안전 연구원 통과증', 0, 10);
  ctx.restore();

  ctx.fillStyle='#16323f';
  ctx.font='700 44px "Jua", "Noto Sans KR", sans-serif';
  ctx.fillText(`${S.studentName} 연구원`, W/2, 224);

  ctx.fillStyle='#3a5563';
  ctx.font='700 22px "Noto Sans KR", sans-serif';
  ctx.fillText(S.unitName, W/2, 268);

  const tagStr=S.tags.map(t=>`${TAGS[t].ic} ${TAGS[t].n}`).join('   ');
  ctx.fillStyle='#9a5b00';
  ctx.font='700 18px "Noto Sans KR", sans-serif';
  ctx.fillText(tagStr, W/2, 306);

  ctx.fillStyle='#52707e';
  ctx.font='500 18px "Noto Sans KR", sans-serif';
  ctx.fillText(`발급 일시: ${S.passDate} ${S.passTime}`, W/2, 344);

  const finish=()=>{
    ctx.fillStyle='#1b8a5a';
    ctx.font='700 20px "Noto Sans KR", sans-serif';
    ctx.fillText('안전 수칙을 지키며 즐겁고 안전하게 실험하겠습니다!', W/2, 504);

    const a=document.createElement('a');
    a.download=`안전통과증_${S.studentName.trim()||'연구원'}.png`;
    a.href=cv.toDataURL('image/png');
    a.click();
  };

  if(S.sigData){
    const img=new Image();
    img.onload=()=>{
      ctx.drawImage(img, W/2-150, 365, 300, 75);
      ctx.strokeStyle='#b9cdd8';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(W/2-130, 446); ctx.lineTo(W/2+130, 446); ctx.stroke();
      finish();
    };
    img.onerror=finish;
    img.src=S.sigData;
  }else{
    finish();
  }
}

    $('#view').innerHTML=`
      <div class="pass-card">
        <div style="font-weight:700;color:var(--acc);font-size:15px">꼬마 과학자의 실험실 · 5분 안전교육 완료</div>
        <div class="pass-stamp">✔ 안전 연구원 통과증</div>
        <div class="pass-name">${esc(S.studentName)} 연구원</div>
        <div class="pass-meta"><b>${esc(S.unitName)}</b></div>
        <div class="tags" style="justify-content:center;margin:8px 0">${tagBadges(S.tags)}</div>
        <div class="pass-meta">발급 일시: ${S.passDate} ${S.passTime}</div>
        ${S.sigData?`<img class="pass-sig" src="${S.sigData}" alt="학생 서명">`:''}
        ${syncHtml}
        <p style="margin:12px 0 0;font-weight:700;color:var(--ok)">이 화면을 선생님께 보여 드리고 안전하게 실험을 시작하세요!</p>
      </div>
      <div class="bar">
        <button class="btn ghost" id="editPass">◀ 다시 쓰기</button>
        <button class="btn main" id="saveImg">🖼️ 사진(PNG)으로 저장하기</button>
      </div>
    `;
    $('#editPass').onclick=()=>{S.passIssued=false;render()};
    $('#saveImg').onclick=downloadPassPNG;
    const rt=$('#retrySync'); if(rt) rt.onclick=sendToSheet;
    return;
  }

  $('#view').innerHTML=`
    <h2>4단계. 안전 서약 및 통과증 받기 (1분)</h2>
    <p class="sub">안전 서약을 확인하고 이름과 서명을 남기면 ‘안전 연구원 통과증’이 발급돼요.</p>
    <div class="pledge-box">
      <label class="chk-card ${S.pledged?'checked':''}" style="margin-bottom:12px;background:var(--card)">
        <input type="checkbox" id="plChk" ${S.pledged?'checked':''}>
        <div><b>나는 오늘 배운 안전 수칙을 지키며 선생님 말씀에 따라 안전하게 실험하겠습니다.</b></div>
      </label>
      <label style="display:block;font-weight:700;margin-bottom:4px" for="stName">내 이름 (번호와 이름을 함께 써도 좋아요)</label>
      <input type="text" id="stName" placeholder="예: 3번 김과학" value="${esc(S.studentName)}">
      <div class="sig-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-weight:700;font-size:15px">내 서명 (손가락이나 마우스로 그려요)</span>
          <button class="btn ghost" id="clrSig" style="font-size:12px;padding:3px 9px">지우기</button>
        </div>
        <canvas class="sig" id="sigPad" width="600" height="120"></canvas>
      </div>
    </div>
    <div class="bar">
      <button class="btn ghost" id="b3">◀ 이전</button>
      <button class="btn main" id="issueBtn" ${S.pledged&&S.studentName.trim()?'':'disabled'}>🏅 안전 통과증 발급받기</button>
    </div>
  `;

  const syncBtn=()=>{$('#issueBtn').disabled=!(S.pledged&&S.studentName.trim())};
  $('#plChk').onchange=e=>{S.pledged=e.target.checked;e.target.closest('label').classList.toggle('checked',S.pledged);syncBtn()};
  $('#stName').oninput=e=>{S.studentName=e.target.value;syncBtn()};
  $('#b3').onclick=()=>{S.step=3;render(true)};

  const cv=$('#sigPad'), ctx=cv.getContext('2d');
  ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111827';
  let drawing=false, drawn=false;
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{drawing=true;drawn=true;const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
  cv.onpointerup=()=>{drawing=false};
  $('#clrSig').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);drawn=false;S.sigData=''};

  $('#issueBtn').onclick=()=>{
    if(drawn)S.sigData=cv.toDataURL();
    const now=new Date();
    S.passDate=todayISO();
    S.passTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    S.passIssued=true;
    if(S.sheetUrl){
      sendToSheet();
    }else{
      render();
    }
  };
}

function render(scrollTop=false){
  renderNav();
  if(S.step===0)viewSelect();
  else if(S.step===1)viewStep1();
  else if(S.step===2)viewStep2();
  else if(S.step===3)viewStep3();
  else if(S.step===4)viewStep4();
  if(scrollTop) window.scrollTo(0,0);
}

function checkUrlBoot(){
  const raw=(location.hash?location.hash.slice(1):'')||(location.search?location.search.slice(1):'');
  if(!raw)return false;
  const p=new URLSearchParams(raw);
  const tStr=p.get('t');
  if(tStr){
    const tags=tStr.split(',').filter(k=>TAGS[k]);
    const name=p.get('n')||'오늘의 과학 실험';
    const sUrl=p.get('s')||'';
    if(sUrl) S.sheetUrl=sUrl;
    if(tags.length){startSession(name, tags, 0, 0, true);return true;}
  }
  return false;
}

if(!checkUrlBoot()) render();
</script>
</body>
</html>
